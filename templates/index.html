<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hybrid Voice Agent (Debug Mode)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e1e; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; }
        
        /* Controls */
        #controls { margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        #startBtn { background-color: #28a745; color: white; }
        #startBtn:hover { background-color: #218838; }
        #startBtn.active { background-color: #dc3545; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* Status Display */
        #status { font-size: 24px; margin-bottom: 20px; color: #00d2ff; height: 30px; }

        /* Debug Logs */
        #console-container { width: 90%; max-width: 800px; height: 400px; background: #000; border: 2px solid #444; overflow-y: scroll; padding: 10px; font-family: monospace; border-radius: 5px; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .log-time { color: #888; font-size: 12px; margin-right: 10px; }
        
        /* Log Colors */
        .info { color: #ddd; }
        .user { color: #00ff00; font-weight: bold; }
        .bot { color: #00d2ff; font-weight: bold; }
        .interrupt { color: #ff0000; background: #220000; font-weight: bold; padding: 2px; }
        .error { color: #ff4444; }
        .system { color: #ffff00; }

    </style>
</head>
<body>

    <h1>🤖 Interruptible Voice Agent</h1>
    <div id="status">Ready</div>
    
    <div id="controls">
        <button id="startBtn" onclick="toggleAgent()">Start Agent</button>
    </div>

    <h3>Debug Logs:</h3>
    <div id="console-container" id="logs"></div>

    <script>
        // --- CONFIGURATION ---
        const SERVER_URL = "http://localhost:5000/process_speech";
        
        // --- GLOBALS ---
        let recognition;
        let isListening = false;
        const synth = window.speechSynthesis;
        const btn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const logContainer = document.getElementById('console-container');

        // --- LOGGING FUNCTION ---
        function log(msg, type = "info") {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString().split(' ')[0];
            div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight; // Auto scroll
        }

        // --- INITIALIZE SPEECH RECOGNITION ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;       // Keep listening
            recognition.interimResults = false;  // Only final results
            recognition.lang = 'en-US';

            log("🎤 Speech API initialized.", "system");

            recognition.onstart = () => {
                isListening = true;
                statusEl.innerText = "👂 Listening...";
                btn.innerText = "Stop Agent";
                btn.classList.add('active');
                log("Microphone active.", "system");
            };

            recognition.onend = () => {
                if (isListening) {
                    log("🔄 Loop ended. Restarting...", "info");
                    recognition.start();
                } else {
                    statusEl.innerText = "🛑 Stopped";
                    btn.innerText = "Start Agent";
                    btn.classList.remove('active');
                    log("Agent Stopped.", "system");
                }
            };

            recognition.onerror = (event) => {
                log(`⚠️ Speech Error: ${event.error}`, "error");
            };

            // --- THE CORE LOGIC ---
            recognition.onresult = async (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                if (!transcript) return;

                // 1. INTERRUPT CHECK
                if (synth.speaking) {
                    log("🚨 INTERRUPT DETECTED! Canceling audio.", "interrupt");
                    synth.cancel();
                }

                log(`User said: "${transcript}"`, "user");
                statusEl.innerText = "🧠 Thinking...";

                // 2. SEND TO PYTHON
                try {
                    log(`Sending to backend...`, "info");
                    
                    const response = await fetch(SERVER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: transcript })
                    });

                    if (!response.ok) throw new Error(`Server Error: ${response.status}`);

                    const data = await response.json();
                    const reply = data.reply;

                    log(`AI Reply: "${reply}"`, "bot");
                    
                    // 3. SPEAK RESPONSE
                    speak(reply);

                } catch (err) {
                    log(`❌ Connection Failed: ${err.message}`, "error");
                    statusEl.innerText = "Error";
                    speak("I cannot reach the server.");
                }
            };

        } else {
            log("❌ CRITICAL: Web Speech API not supported in this browser.", "error");
            alert("Please use Google Chrome or Microsoft Edge.");
        }

        // --- TTS FUNCTION ---
        function speak(text) {
            if (!text) return;
            
            statusEl.innerText = "🗣️ Speaking...";
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Voice settings
            utterance.rate = 1.1;
            utterance.pitch = 1.0;

            utterance.onstart = () => log("🔊 TTS Started", "info");
            utterance.onend = () => {
                log("✅ TTS Finished", "info");
                if (isListening) statusEl.innerText = "👂 Listening...";
            };

            synth.speak(utterance);
        }

        // --- BUTTON HANDLER ---
        function toggleAgent() {
            if (!isListening) {
                synth.cancel(); // Clear any leftover audio
                recognition.start();
            } else {
                isListening = false;
                recognition.stop();
                synth.cancel();
            }
        }
    </script>
</body>
</html>
